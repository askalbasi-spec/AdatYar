name: Build AdatYar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project wrapper
        run: |
          mkdir -p app/src/main/assets app/src/main/java/ir/adatyar/app app/src/main/res/values app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AdatYar'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ir.adatyar.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'ir.adatyar.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <application android:theme="@style/AppTheme" android:label="عادت‌یار" android:icon="@drawable/ic_launcher" android:usesCleartextTraffic="false">
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#176B55" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#F4C45E" android:pathData="M24,38C11,31 10,17 24,8C38,17 37,31 24,38Z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M24,36L24,15"/>
          </vector>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B55</item>
                  <item name="android:statusBarColor">#145844</item>
                  <item name="android:navigationBarColor">#145844</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/java/ir/adatyar/app/MainActivity.java <<'EOF'
          package ir.adatyar.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.app.AlarmManager;
          import android.media.AudioAttributes;
          import android.provider.Settings;
          import android.print.PrintManager;
          import android.app.PendingIntent;
          import android.os.Build;
          import android.content.Intent;
          import android.content.Context;
          import java.util.Calendar;
          public class MainActivity extends Activity {
              private WebView web;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  web.addJavascriptInterface(new AlarmBridge(this), "AndroidAlarm");
                  web.addJavascriptInterface(new PrintBridge(this, web), "AndroidPrint");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  setContentView(web);
                  if (state == null) web.loadUrl("file:///android_asset/index.html");
                  else web.restoreState(state);
              }
              public static class PrintBridge {
                  private final Activity activity; private final WebView web;
                  PrintBridge(Activity a, WebView w) { activity=a; web=w; }
                  @JavascriptInterface public void printReport() { activity.runOnUiThread(() -> { PrintManager pm=(PrintManager)activity.getSystemService(Context.PRINT_SERVICE); pm.print("AdatYar-Report", web.createPrintDocumentAdapter("گزارش عادت‌یار"), new android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).setResolution(new android.print.PrintAttributes.Resolution("pdf","PDF",300,300)).setMinMargins(android.print.PrintAttributes.Margins.NO_MARGINS).build()); }); }
              }
              public static class AlarmBridge {
                  private final Context context;
                  AlarmBridge(Context c) { context = c.getApplicationContext(); }
                  @JavascriptInterface public void scheduleDaily(int hour, int minute, String title, int alarmId) {
                      Intent i = new Intent(context, AlarmReceiver.class); i.putExtra("title", title);
                      PendingIntent pi = PendingIntent.getBroadcast(context, alarmId, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      Calendar c = Calendar.getInstance(); c.set(Calendar.HOUR_OF_DAY, hour); c.set(Calendar.MINUTE, minute); c.set(Calendar.SECOND, 0); if (c.getTimeInMillis() <= System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR, 1);
                      i.putExtra("hour", hour); i.putExtra("minute", minute); i.putExtra("alarmId", alarmId);
                      if (Build.VERSION.SDK_INT >= 23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi); else am.setExact(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi);
                  }
                  @JavascriptInterface public void cancelDaily(int alarmId) { Intent i = new Intent(context, AlarmReceiver.class); PendingIntent pi = PendingIntent.getBroadcast(context, alarmId, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE); ((AlarmManager)context.getSystemService(Context.ALARM_SERVICE)).cancel(pi); pi.cancel(); }
              }
              @Override public void onBackPressed() { if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
          }
          EOF
          cat > app/src/main/java/ir/adatyar/app/AlarmReceiver.java <<'EOF'
          package ir.adatyar.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;
          import android.media.AudioAttributes;
          import android.provider.Settings;
          public class AlarmReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  NotificationManager nm=(NotificationManager)context.getSystemService(Context.NOTIFICATION_SERVICE);
                  String channel="adatyar-reminders";
                  if(Build.VERSION.SDK_INT>=26) { NotificationChannel nc=new NotificationChannel(channel,"یادآورهای عادت‌یار",NotificationManager.IMPORTANCE_HIGH); nc.setSound(Settings.System.DEFAULT_NOTIFICATION_URI,new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).build()); nc.enableVibration(true); nm.createNotificationChannel(nc); }
                  String title=intent.getStringExtra("title"); if(title==null||title.isEmpty()) title="زمان انجام عادت روزانه است";
                  Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(context,channel):new Notification.Builder(context);
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle("یادآور عادت‌یار").setContentText(title).setAutoCancel(true);
                  nm.notify(intent.getIntExtra("alarmId", 7401),b.build());
                  int hour=intent.getIntExtra("hour",-1), minute=intent.getIntExtra("minute",-1), id=intent.getIntExtra("alarmId",-1);
                  if(hour>=0 && minute>=0 && id>=0) {
                      Intent next=new Intent(context, AlarmReceiver.class); next.putExtra("title",title); next.putExtra("hour",hour); next.putExtra("minute",minute); next.putExtra("alarmId",id);
                      android.app.PendingIntent pi=android.app.PendingIntent.getBroadcast(context,id,next,android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                      java.util.Calendar cal=java.util.Calendar.getInstance(); cal.set(java.util.Calendar.HOUR_OF_DAY,hour); cal.set(java.util.Calendar.MINUTE,minute); cal.set(java.util.Calendar.SECOND,0); cal.set(java.util.Calendar.MILLISECOND,0); if(cal.getTimeInMillis()<=System.currentTimeMillis())cal.add(java.util.Calendar.DAY_OF_YEAR,1);
                      android.app.AlarmManager am=(android.app.AlarmManager)context.getSystemService(Context.ALARM_SERVICE); if(Build.VERSION.SDK_INT>=23)am.setExactAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP,cal.getTimeInMillis(),pi); else am.setExact(android.app.AlarmManager.RTC_WAKEUP,cal.getTimeInMillis(),pi);
                  }
              }
          }
          EOF
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AdatYar-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
